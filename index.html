<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Recipes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <section class="hero">
      <h1>Family Recipes</h1>
      <p>A collection of our favorite recipes.</p>

      <input
        class="search-box"
        type="text"
        placeholder="Search Recipes..."
        >
    </section>

    <section class="recipe-grid">

      <div class="recipe-card">
        <h2>Grandma's Sugar Cookies</h2>
        <p>Cookies - Christmas - Baked - Baking</p>
      </div>

      <div class="recipe-card">
        <h2>Dad's Fluffy Waffles</h2>
        <p>Breakfast - Waffles - Dad</p>
      </div>

      <div class="recipe-card">
        <h2>Mom's Peanut Butter Muffins</h2>
        <p>Breakfast - Snacks - Muffins - Baking</p>
      </div>
      
    </section>
    
  </main>
  
</html>
