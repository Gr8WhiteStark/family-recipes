<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Family Recipes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main>

    <section class="hero">

        <h1>Family Recipes</h1>

        <p>A collection of our family's favorite recipes.</p>

        <input
            id="search-box"
            class="search-box"
            type="text"
            placeholder="Search recipes, people, or tags..."
        >

    </section>


    <section>

        <div
            id="tag-container"
            class="tag-container">
        </div>

    </section>


    <section
        id="recipe-grid"
        class="recipe-grid">
    </section>

</main>


<script src="script.js"></script>

</body>

</html>
